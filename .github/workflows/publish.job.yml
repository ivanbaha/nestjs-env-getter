on: workflow_call
permissions:
  contents: write
  id-token: write # required for provenance support

jobs:
  publish:
    name: Publish to NPM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "26"
          registry-url: "https://registry.npmjs.org/"

      - name: Download dist artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist-${{ github.sha }}
          path: dist

      # npm's OIDC exchange fails silently and only surfaces later as an auth error,
      # so a missing `id-token: write` is reported here instead.
      - name: Check an OIDC token can be minted
        run: |
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::No OIDC token endpoint in this job — it is missing 'id-token: write'."
            exit 1
          fi

      # No npm token: npm trusted publishing (OIDC, npm >= 11.5.1). This runs as a reusable
      # workflow, and npm validates the *calling* workflow, so the trusted publisher on
      # npmjs.com is registered for release.yml, not this file.
      - name: Publish package to npm
        run: npm publish --provenance --access public
